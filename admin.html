<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EXTAY · 챗봇 관리</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#211a14;background:#f7f2ec}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,440px);background:#fff;border:1px solid #e5dcd1;border-radius:22px;padding:26px;box-shadow:0 16px 45px #4b37251a}
    h1{font-size:24px;margin:0 0 8px}p{color:#75695e;font-size:14px;line-height:1.5;margin:0 0 20px}
    label{display:block;font-weight:650;font-size:13px;margin:16px 0 7px}input,textarea{width:100%;font:inherit;border:1px solid #d9cec1;border-radius:11px;padding:11px;background:#fff}textarea{min-height:76px;resize:vertical}
    button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:#211a14;color:#fff;font-weight:650}.secondary{background:#eee7df;color:#211a14}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}.status{padding:12px 14px;border-radius:12px;background:#f2eee9;margin:18px 0;font-size:14px}.status strong{display:block;margin-top:3px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}.feedback{min-height:22px;font-size:13px;color:#75695e;margin-top:12px}.toggle{position:relative;width:52px;height:30px;padding:0;border-radius:20px;background:#b9afa5}.toggle.on{background:#36734c}.toggle i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.toggle.on i{left:26px}
  </style>
</head>
<body>
  <main>
    <h1>챗봇 운영 관리</h1>
    <p>게스트 가이드에서 AI 컨시어지 노출과 호출을 제어합니다.</p>
    <form id="loginForm">
      <label for="password">관리자 비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" style="margin-top:12px;width:100%">상태 불러오기</button>
    </form>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <section id="controls" hidden>
      <div class="status" id="status" role="status">현재 상태를 불러오는 중…</div>
      <div class="row"><span>게스트 챗봇</span><button id="toggle" class="toggle" type="button" aria-pressed="false" aria-label="챗봇 켜기/끄기"><i></i></button></div>
      <label for="reason">변경 사유 (선택)</label><textarea id="reason" maxlength="300" placeholder="예: 점검 중"></textarea>
      <div class="actions"><button id="save" type="button">저장</button><a class="secondary" href="guide-extay.html" style="display:grid;place-items:center;text-decoration:none;border-radius:11px;padding:11px 15px">게스트 가이드</a></div>
    </section>
  </main>
  <script>
    (()=>{
      let password='', enabled=false, savedEnabled=false;
      const $=id=>document.getElementById(id), form=$('loginForm'), controls=$('controls'), status=$('status'), toggle=$('toggle'), feedback=$('feedback');
      function render(){toggle.classList.toggle('on',enabled);toggle.setAttribute('aria-pressed',String(enabled));toggle.setAttribute('aria-label',enabled?'챗봇 끄기':'챗봇 켜기');status.innerHTML=`현재 상태<strong>${enabled?'켜짐':'꺼짐'}</strong>`}
      async function request(path,options={}){const headers={'Accept':'application/json','X-Admin-Password':password,...(options.body?{'Content-Type':'application/json'}:{})};const res=await fetch(path,{...options,headers});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||`요청 실패 (${res.status})`);return data}
      form.addEventListener('submit',async e=>{e.preventDefault();password=$('password').value;feedback.textContent='';try{const data=await request('/api/admin/chat-control');enabled=data.enabled===true;savedEnabled=enabled;$('reason').value=data.reason||'';controls.hidden=false;form.hidden=true;render()}catch(error){feedback.textContent=error.message;password=''}});
      toggle.addEventListener('click',()=>{enabled=!enabled;render();feedback.textContent=enabled===savedEnabled?'':'변경 사항을 저장해 주세요.'});
      $('save').addEventListener('click',async()=>{feedback.textContent='저장 중…';try{const data=await request('/api/admin/chat-control',{method:'PUT',body:JSON.stringify({enabled,reason:$('reason').value.trim()})});enabled=data.enabled===true;savedEnabled=enabled;render();feedback.textContent='저장했습니다.'}catch(error){feedback.textContent=error.message}});
    })();
  </script>
</body>
</html>
